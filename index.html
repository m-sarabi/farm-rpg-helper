<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm RPG Quest & Material Tracker</title>
  <meta name="description" content="Manage your Farm RPG quests, calculate aggregate material requirements, check against your inventory cap, and optimize your farm progression." />
  
  <!-- Favicon with authentic Corn PNG -->
  <link rel="icon" href="./assets/Corn.png" type="image/png" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="#" class="brand" id="brand-home-link">
        <div class="brand-icon">
          <img src="./assets/Corn.png" alt="Corn" class="brand-icon-img" />
        </div>
        <div>
          <div class="brand-title">
            Farm RPG Helper
            <span class="brand-badge">Tracker</span>
          </div>
          <div class="brand-subtitle">Quests & Material Planner</div>
        </div>
      </a>

      <div class="header-actions">
        <!-- Live Quick Stats -->
        <div class="header-stats" id="header-stats-bar">
          <span class="stat-pill" id="stat-active-count">0 Active</span>
          <span>•</span>
          <span class="stat-pill completed-pill" id="stat-completed-count">0 Completed</span>
        </div>

        <!-- Theme Toggle Button -->
        <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
          🌓
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav class="app-nav">
    <div class="nav-container">
      <button class="nav-tab active" data-tab="quests" id="tab-btn-quests">
        <span>📜</span>
        <span>Quests</span>
        <span class="tab-count" id="badge-quest-count">0</span>
      </button>
      <button class="nav-tab" data-tab="planner" id="tab-btn-planner">
        <span>🧺</span>
        <span>Material Planner</span>
        <span class="tab-count" id="badge-planner-count">0</span>
      </button>
      <button class="nav-tab" data-tab="settings" id="tab-btn-settings">
        <span>⚙️</span>
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <!-- Main View Container -->
  <main class="main-content" id="main-content">
    <!-- Active view content will be dynamically rendered here by app.js -->
  </main>

  <!-- Modal: Add / Edit Quest -->
  <div class="modal-backdrop" id="quest-modal" role="dialog" aria-modal="true" aria-labelledby="modal-quest-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-quest-title">Add New Quest</h3>
        <button type="button" class="modal-close-btn" id="modal-close-x" aria-label="Close dialog">&times;</button>
      </div>
      <form id="quest-form">
        <div class="modal-body">
          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label" for="quest-name-input">Quest Title *</label>
              <input type="text" id="quest-name-input" class="input-field" placeholder="e.g. Corn Quandary II" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="quest-npc-input">Quest Giver (NPC) *</label>
              <select id="quest-npc-input" class="input-field" required>
                <!-- Filled dynamically with NPC list -->
              </select>
            </div>
          </div>

          <!-- Level Prerequisites Accordion -->
          <div class="form-group">
            <details class="skills-accordion" id="modal-skills-accordion">
              <summary class="skills-accordion-summary">
                <span class="skills-summary-left">
                  <span class="skills-accordion-icon">🎯</span>
                  <strong>Level Prerequisites</strong>
                </span>
                <span class="skills-summary-badge" id="skills-summary-badge">Not set (all 0)</span>
              </summary>
              <div class="skills-accordion-body">
                <div class="skills-accordion-desc">Set required level for any of the 6 skills (0 = not required):</div>
                <div class="skills-grid">
                  <div class="skill-input-row">
                    <label class="skill-label" for="skill-req-farming"><img src="./assets/Corn.png" alt="Farming" class="skill-icon-inline" /> Farming</label>
                    <input type="number" id="skill-req-farming" class="input-field skill-level-input" data-skill="farming" min="0" max="99" value="0" placeholder="0" />
                  </div>
                  <div class="skill-input-row">
                    <label class="skill-label" for="skill-req-fishing">🎣 Fishing</label>
                    <input type="number" id="skill-req-fishing" class="input-field skill-level-input" data-skill="fishing" min="0" max="99" value="0" placeholder="0" />
                  </div>
                  <div class="skill-input-row">
                    <label class="skill-label" for="skill-req-crafting">🔨 Crafting</label>
                    <input type="number" id="skill-req-crafting" class="input-field skill-level-input" data-skill="crafting" min="0" max="99" value="0" placeholder="0" />
                  </div>
                  <div class="skill-input-row">
                    <label class="skill-label" for="skill-req-exploring">🧭 Exploring</label>
                    <input type="number" id="skill-req-exploring" class="input-field skill-level-input" data-skill="exploring" min="0" max="99" value="0" placeholder="0" />
                  </div>
                  <div class="skill-input-row">
                    <label class="skill-label" for="skill-req-cooking">🍳 Cooking</label>
                    <input type="number" id="skill-req-cooking" class="input-field skill-level-input" data-skill="cooking" min="0" max="99" value="0" placeholder="0" />
                  </div>
                  <div class="skill-input-row">
                    <label class="skill-label" for="skill-req-mining">⛏️ Mining</label>
                    <input type="number" id="skill-req-mining" class="input-field skill-level-input" data-skill="mining" min="0" max="99" value="0" placeholder="0" />
                  </div>
                </div>
              </div>
            </details>
          </div>

          <div class="form-group" style="margin-top: -0.25rem;">
            <label class="checkbox-label">
              <input type="checkbox" id="quest-pinned-input" />
              <span>⭐ Pin to Favorites / Planner</span>
            </label>
          </div>

          <div class="form-group">
            <label class="form-label" for="quest-desc-input">Description / Story</label>
            <textarea id="quest-desc-input" class="input-field" placeholder="Brief notes or NPC dialogue..."></textarea>
          </div>

          <!-- Requirements Section -->
          <div class="modal-section-header">
            <label class="form-label">Required Materials</label>
            <button type="button" class="btn btn-outline btn-xs" id="modal-add-req-btn">+ Add Item</button>
          </div>
          <div id="modal-requirements-list" class="modal-dynamic-rows">
            <!-- Dynamic rows inserted here -->
          </div>

          <!-- Rewards Section -->
          <div class="modal-section-header">
            <label class="form-label">Rewards</label>
            <button type="button" class="btn btn-outline btn-xs" id="modal-add-rew-btn">+ Add Reward</button>
          </div>
          <div id="modal-rewards-list" class="modal-dynamic-rows">
            <!-- Dynamic rows inserted here -->
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-submit-btn">Save Quest</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <div>Farm RPG Quest & Material Tracker • Built for the Farm RPG community</div>
    </div>
  </footer>

  <!-- Application Logic -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
