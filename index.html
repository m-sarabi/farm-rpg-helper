<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm RPG Quest & Material Tracker</title>
  <meta name="description" content="Manage your Farm RPG quests, calculate aggregate material requirements, check against your inventory cap, and optimize your farm progression." />
  
  <!-- Favicon with authentic Corn PNG -->
  <link rel="icon" href="./assets/Corn.png" type="image/png" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="#" class="brand" id="brand-home-link">
        <div class="brand-icon">
          <img src="./assets/Corn.png" alt="Corn" class="brand-icon-img" />
        </div>
        <div>
          <div class="brand-title">
            Farm RPG Helper
            <span class="brand-badge">Tracker</span>
          </div>
          <div class="brand-subtitle">Quests & Material Planner</div>
        </div>
      </a>

      <div class="header-actions">
        <!-- Live Quick Stats -->
        <div class="header-stats" id="header-stats-bar">
          <span class="stat-pill" id="stat-active-count">0 Active</span>
          <span>•</span>
          <span class="stat-pill completed-pill" id="stat-completed-count">0 Completed</span>
        </div>

        <!-- Theme Toggle Button -->
        <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
          🌓
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav class="app-nav">
    <div class="nav-container">
      <button class="nav-tab active" data-tab="quests" id="tab-btn-quests">
        <span>📜</span>
        <span>Quests</span>
        <span class="tab-count" id="badge-quest-count">0</span>
      </button>
      <button class="nav-tab" data-tab="planner" id="tab-btn-planner">
        <span>🧺</span>
        <span>Material Planner</span>
        <span class="tab-count" id="badge-planner-count">0</span>
      </button>
      <button class="nav-tab" data-tab="settings" id="tab-btn-settings">
        <span>⚙️</span>
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <!-- Main View Container -->
  <main class="main-content" id="main-content">
    <!-- Active view content will be dynamically rendered here by app.js -->
  </main>



  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <div>Farm RPG Quest & Material Tracker • Built for the Farm RPG community</div>
    </div>
  </footer>

  <!-- Application Logic -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
